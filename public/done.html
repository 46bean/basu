<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>등록 완료 · ㄴㅇㅈㄹ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --sub: #737373;
    --line: #e4e4e4;
    --line-strong: #0a0a0a;
    --card: #ffffff;
    --wash: #f4f4f4;
    --r-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px; background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .logo { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .14em; }
  .chip {
    padding: 5px 13px; border-radius: var(--r-pill); background: var(--wash);
    font-size: 11px; color: var(--sub); letter-spacing: .02em;
    border: 1px solid transparent; white-space: nowrap;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 64px; }

  .flag {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--sub); letter-spacing: .04em; margin: 0 0 14px;
  }
  .flag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }

  .card {
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--card);
    padding: 24px 22px 22px;
  }
  .head { display: flex; align-items: flex-start; gap: 14px; }
  .letter {
    flex: 0 0 46px; width: 46px; height: 46px; border-radius: 2px;
    border: 1px solid var(--line-strong); background: var(--card);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; line-height: 1;
  }
  .head .meta { flex: 1 1 auto; min-width: 0; }
  .word {
    margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: -.01em;
    line-height: 1.28; overflow-wrap: anywhere;
  }
  .byline { margin: 0; font-size: 12px; color: var(--sub); }

  h3 {
    margin: 24px 0 8px; font-size: 12px; font-weight: 600; color: var(--sub);
    letter-spacing: .1em; text-transform: uppercase;
  }
  .body-text {
    margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .body-text.muted { color: var(--sub); }

  figure { margin: 16px 0 0; }
  figure img {
    display: block; width: 100%; height: auto; border-radius: 4px;
    border: 1px solid var(--line); background: var(--wash);
  }

  ul.notes { margin: 0; padding: 0; list-style: none; }
  ul.notes li {
    border-top: 1px solid var(--line); padding: 12px 0 0; margin-top: 12px;
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  ul.notes li:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  ul.notes li .who { display: block; font-size: 11px; color: var(--sub); margin-top: 6px; }

  .actions { display: flex; flex-wrap: wrap; gap: 9px; margin: 26px 0 0; }
  .btn {
    appearance: none; text-decoration: none; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
    border-radius: var(--r-pill); padding: 10px 20px; font-size: 14px; font-weight: 500;
    font-family: inherit; transition: background .15s, color .15s;
  }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn:hover { background: var(--ink); color: #fff; }
  .btn.primary:hover { background: #fff; color: var(--ink); }

  .footnote { margin: 22px 0 0; font-size: 12px; color: var(--sub); }
  .footnote code { background: var(--wash); padding: 1px 5px; border-radius: 2px; font-size: 11px; }
  .loading { color: var(--sub); font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="logo">ㄴㅇㅈㄹ</h1>
  <span class="chip" id="chip">등록 완료</span>
</header>

<main>
  <p class="flag"><span class="dot"></span><span id="flag-text">방금 등록한 단어</span></p>

  <div class="card" id="card">
    <div class="head">
      <div class="letter" id="letter">ㅅ</div>
      <div class="meta">
        <h2 class="word" id="word">불러오는 중…</h2>
        <p class="byline" id="byline">–</p>
      </div>
    </div>
    <div id="meaning-wrap">
      <h3>등장배경</h3>
      <p class="body-text muted" id="meaning">등장배경이 없습니다.</p>
    </div>
    <div id="image-wrap"></div>
    <div id="notes-wrap"></div>
  </div>

  <div class="actions">
    <a class="btn primary" href="/" id="open-site">사이트 열기</a>
    <a class="btn" href="/" id="open-letter">이 글자 보기</a>
  </div>

  <p class="footnote" id="footnote"></p>
</main>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '';
  const letterParam = params.get('letter') || '';
  const wordParam = params.get('word') || '';

  /* 한글 첫 글자의 초성 / 영문 첫 글자 → 사이트의 '글자' 값 */
  function initialOf(w) {
    const t = (w || '').trim();
    if (!t) return '';
    const ch = t[0];
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
      return CHO[Math.floor((code - 0xAC00) / 588)] || ch;
    }
    return ch.toUpperCase();
  }
  const letter = letterParam || initialOf(wordParam);
  const esc = (v) => (v == null ? '' : String(v));

  /* 값이 아예 없을 때 안내 */
  if (!id && !letter && !wordParam) {
    $('#flag-text').textContent = '단어를 찾을 수 없습니다';
    $('#word').textContent = '주소에 값이 없습니다';
    $('#byline').textContent = '단축어에서 실행하면 방금 등록한 단어가 표시됩니다.';
    $('#letter').textContent = '·';
    $('#chip').textContent = '안내';
  }
  if (wordParam) $('#word').textContent = wordParam;
  if (letter) $('#letter').textContent = letter;

  function render(card) {
    if (!card) return;
    $('#word').textContent = esc(card.word) || wordParam;
    $('#letter').textContent = esc(card.letter) || letter || '·';
    const who = esc(card.display_name) || esc(card.author);
    $('#byline').textContent = who
      ? '작성자 ' + who + (card.created_at ? ' · ' + esc(card.created_at) : '')
      : esc(card.created_at);
    const meaning = esc(card.meaning);
    $('#meaning').textContent = meaning || '등장배경이 없습니다.';
    $('#meaning').classList.toggle('muted', !meaning);
    const img = esc(card.image);
    if (img) {
      $('#image-wrap').innerHTML =
        '<h3>사진</h3><figure><img alt="첨부한 사진" src="' + img.replace(/"/g, '&quot;') + '"></figure>';
    }
    $('#chip').textContent = '등록 완료';
    $('#flag-text').textContent = '방금 등록한 단어';
  }

  function renderNotes(notes) {
    if (!notes || !notes.length) return;
    const items = notes.map(function (n) {
      const who = esc(n.display_name) || esc(n.nickname) || '';
      return '<li>' + esc(n.body).replace(/</g, '&lt;') +
        (who ? '<span class="who">' + who + '</span>' : '') + '</li>';
    }).join('');
    $('#notes-wrap').innerHTML = '<h3>덧붙인 등장배경</h3><ul class="notes">' + items + '</ul>';
  }

  /* 서버에서 카드 값을 읽어 채웁니다 */
  if (letter) {
    $('#footnote').innerHTML = '글자 <code>' + letter + '</code>' +
      (id ? ' · 항목 번호 <code>' + id + '</code>' : '');
    fetch('/api/cards?letter=' + encodeURIComponent(letter) + '&mode=word&limit=300')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.cards || !data.cards.length) return;
        let hit = null;
        if (id) hit = data.cards.filter(function (c) { return String(c.id) === String(id); })[0];
        if (!hit && wordParam) {
          const matches = data.cards.filter(function (c) { return c.word === wordParam; });
          if (matches.length) {
            matches.sort(function (a, b) {
              return String(b.created_at).localeCompare(String(a.created_at));
            });
            hit = matches[0];
          }
        }
        if (!hit && data.cards.length === 1) hit = data.cards[0];
        if (!hit && data.cards.length) {
          const newest = data.cards.slice().sort(function (a, b) {
            return String(b.created_at).localeCompare(String(a.created_at));
          });
          hit = newest[0];
        }
        if (!hit) return;
        render(hit);
        fetch('/api/notes?card_id=' + encodeURIComponent(hit.id))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (nd) { if (nd) renderNotes(nd.notes); })
          .catch(function () {});
      })
      .catch(function () {});
  } else {
    $('#footnote').innerHTML = '글자 <code>—</code>';
  }
})();
</script>

</body>
</html>
